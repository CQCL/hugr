[profile.release]
lto = "thin"

[workspace]
resolver = "2"
members = [
    "hugr",
    "hugr-core",
    "hugr-cli",
    "hugr-model",
    "hugr-llvm",
    "hugr-py",
    "hugr-persistent",
]
default-members = ["hugr", "hugr-core", "hugr-cli", "hugr-model"]

[workspace.package]
rust-version = "1.91"
edition = "2024"
homepage = "https://github.com/quantinuum/hugr"
repository = "https://github.com/quantinuum/hugr"
license = "Apache-2.0"
# authors

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    # Set by our CI
    'cfg(ci_run)',
    # Set by codecov
    'cfg(coverage,coverage_nightly)',
] }

missing_docs = "warn"

[workspace.lints.clippy]
# Unstable check, may cause false positives.
# https://github.com/rust-lang/rust-clippy/issues/5112
debug_assert_with_mut_call = "warn"
too_long_first_doc_paragraph = "warn"
renamed_and_removed_lints = "warn"

[workspace.dependencies]
anyhow = "1.0.101"
insta = { version = "1.47.2" }
bitvec = "1.0.1"
capnp = "0.27.0"
cgmath = "0.18.0"
cool_asserts = "2.0.4"
delegate = "0.13.5"
derive_more = "2.1.1"
downcast-rs = "2.0.2"
enum_dispatch = "0.3.11"
html-escape = "0.2.13"
itertools = "0.15.0"
jsonschema = { version = "0.56.0", default-features = false }
num-rational = "0.4.1"
pastey = "0.2.3"
proptest = "1.11.0"
proptest-derive = "0.8.0"
rand = "0.10.1"
regex = "1.12.3"
regex-syntax = "0.8.9"
rstest = "0.27.0"
semver = "1.0.28"
serde = "1.0.228"
serde_json = { version = "1.0.150", features = ["raw_value"] }
serde_with = "3.20.0"
serde_yaml = "0.9.34"
smallvec = "1.15.1"
smol_str = "0.3.6"
static_assertions = "1.1.0"
tempfile = "3.27"
thiserror = "2.0.18"
typetag = "0.2.22"
walkdir = "2.5.0"
clap = { version = "4.6.1" }
clio = "0.3.5"
clap-verbosity-flag = "3.0.4"
assert_cmd = "2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
indexmap = "2.14.0"
rustc-hash = "2.1.2"
bumpalo = "3.20.3"
pathsearch = "0.2.0"
base64 = "0.23.0"
ordered-float = "5.3.0"
pretty = "0.12.5"
pretty_assertions = "1.4.1"
zstd = "0.14.0"
relrc = "0.5.0"
wyhash = "0.6.0"
fxhash = "0.2.1"
schemars = "1.2.1"
# Pinned at pre-2.9.0 due to a big slowdown in the newer versions.
#
# The `serialization/t_factory/sexpr/without_extensions/decode` and `simple_cfg`
# benchmarks had a ~20% slowdown.
#
# We should try updating later versions once the performance issue is resolved.
pest = "=2.8.8"
pest_derive = "=2.8.8"

# These public dependencies usually require breaking changes downstream, so we
# try to be as permissive as possible.
portgraph = { version = "0.16.1" }
petgraph = { version = ">= 0.8.3, < 0.9", default-features = false }
# There can only be one `pyo3` dependency in the whole workspace, so we use a
# loose version constraint to prevent breaking changes in dependent crates where possible.
pyo3 = ">= 0.27.2, < 0.30"
strum = ">= 0.27.2, < 0.29"

[profile.dev.package]
insta.opt-level = 3

# optimising these packages were found to contribute to property testing
# execution time.
#
# `flamegraph` below is https://github.com/flamegraph-rs/flamegraph
# $ perf record --call-graph=dwarf -F 99999 <unittest executable> prop_roundtrip_
# $ flamegraph --no-inline --perfdata perf.data
rand_chacha.opt-level = 3
rand_chacha.debug = 1
regex.opt-level = 3
regex.debug = 1
regex-automata.opt-level = 3
regex-automata.debug = 1
regex-syntax.opt-level = 3
regex-syntax.debug = 1
proptest.opt-level = 3
proptest.debug = 1
serde.opt-level = 3
serde.debug = 1
serde_json.opt-level = 3
serde_json.debug = 1
jsonschema.opt-level = 3
jsonschema.debug = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# The profile that 'hugr-py' will build with
[profile.release-py]
inherits = "release"
lto = "fat"
strip = "symbols"
panic = "abort"
